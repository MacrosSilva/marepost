name: Imagem Docker do MaréPost

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'NOTICE.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: marepost-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go: "true"
          node: "true"
      - name: Build do frontend
        env:
          POSTHOG_SOURCEMAPS_ENABLED: "0"
        run: bun run build -- frontend
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e publicação da imagem
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/marepost"
          docker buildx build --push --platform linux/amd64 \
            --build-context frontend_artifact=apps/server/cmd/openpost/public \
            --file deploy/docker/Dockerfile \
            --build-arg VERSION="marepost-${GITHUB_SHA::7}" --build-arg COMMIT="$GITHUB_SHA" \
            --cache-from type=gha,scope=marepost --cache-to type=gha,mode=max,scope=marepost \
            --tag "$image:latest" --tag "$image:${GITHUB_SHA::7}" .
